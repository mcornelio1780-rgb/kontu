<style>/* ===== Tokens de marca (nombre y paleta configurables) ===== */
:root{
  --ink:#0A1433;--violet:#2E5BFF;--violet-2:#7B95FF;--lime:#FF8A3D;--hi-ink:#0A1433;--mist:#F1F3F8;--coral:#F0457A;--mint:#16C79A;--amber:#FFB020;--bg-l:#F6F7FB;--band-l:#0A1433;--band-2l:#141F45;
}
[data-palette="nucleo"]{--ink:#0E1024;--violet:#6E56FF;--violet-2:#8E7BFF;--lime:#C8F53B;--hi-ink:#0E1024;--mist:#EEF0F6;--coral:#FF6A4D;--mint:#2BD4A0;--bg-l:#F5F6FA;--band-l:#0E1024;--band-2l:#171A33}
[data-palette="cobre"]{--ink:#1A1514;--violet:#0F8C80;--violet-2:#3CC9BA;--lime:#E07A3F;--hi-ink:#1A1514;--mist:#F1EEEB;--coral:#C2413B;--mint:#2E9E6B;--bg-l:#F7F5F3;--band-l:#1A1514;--band-2l:#2A2220}
[data-palette="selva"]{--ink:#0A2A24;--violet:#0E8F67;--violet-2:#3FD39F;--lime:#5BF0B5;--hi-ink:#0A2A24;--mist:#EDF4F1;--coral:#E2337A;--mint:#1FB57E;--bg-l:#F4F8F6;--band-l:#0A2A24;--band-2l:#123A33}
[data-palette="pacifico"]{--ink:#0C1A3A;--violet:#E2456E;--violet-2:#FF7C9C;--lime:#FF9A3D;--hi-ink:#0C1A3A;--mist:#EEF2FA;--coral:#D9363E;--mint:#18A999;--bg-l:#F6F8FC;--band-l:#0C1A3A;--band-2l:#17284F}
[data-palette="suiza"]{--ink:#18181B;--violet:#2F5BFF;--violet-2:#7A95FF;--lime:#FFD60A;--hi-ink:#18181B;--mist:#F2F2F0;--coral:#FF3B30;--mint:#16A34A;--bg-l:#FAFAF9;--band-l:#18181B;--band-2l:#27272A}
[data-palette="aurora"]{--ink:#24103A;--violet:#5A46FF;--violet-2:#9A8CFF;--lime:#3DE3DC;--hi-ink:#24103A;--mist:#F1EDFA;--coral:#FF6B8B;--mint:#22C3A6;--bg-l:#F8F6FD;--band-l:#24103A;--band-2l:#341A52}
:root{
  --bg:var(--bg-l);--surface:#FFFFFF;--surface-2:var(--mist);--text:var(--ink);--muted:#5B6178;--line:#DCDFEA;
  --accent:var(--violet);--accent-ink:#FFFFFF;--hi:var(--lime);--band:var(--band-l);--band-2:var(--band-2l);--on-band:#EEF0F6;--on-band-muted:#A3A8C3;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--f-body:"Geist","Segoe UI",Roboto,Arial,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px;--r:14px;--r-sm:8px;color-scheme:light}
[data-mode="dark"]{
  --bg:#0B0D1E;--surface:#14172C;--surface-2:#1B1F38;--text:#EEF0F6;--muted:#A3A8C3;--line:#2A2F4D;
  --accent:var(--violet-2);--accent-ink:#0B0D1E;--band:#06071A;--band-2:#14172C;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.6 var(--f-body);overflow-x:hidden}
img,svg,video{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;line-height:1.04;margin:0}
h2{font-size:clamp(1.9rem,3.6vw,3rem);max-width:24ch}
h3{font-size:1.25rem;font-weight:700;letter-spacing:-.015em;line-height:1.2}
h4{font-size:1rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.wrap{width:min(1200px,100% - 2.5rem);margin-inline:auto}
.section{padding:clamp(4rem,8vw,7rem) 0}
.head{display:grid;gap:1rem;margin-bottom:clamp(2rem,4.5vw,3.25rem)}
.kicker{display:inline-flex;align-items:center;gap:.5rem;font:500 .8rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.kicker::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--hi)}
.lead{font-size:1.15rem;color:var(--muted);max-width:64ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(1.1rem,2.5vw,1.6rem)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;font:500 .78rem/1 var(--f-body);padding:.35rem .6rem;border-radius:99px;background:var(--surface-2);color:var(--text);white-space:nowrap}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.bname{text-transform:lowercase}
.chip.v{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--accent)}
.chip.c{background:color-mix(in srgb,var(--coral) 16%,transparent);color:#C4402A}
[data-mode="dark"] .chip.c{color:#FF9A86}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.75rem 1.25rem;border-radius:999px;font:600 1rem/1.2 var(--f-body);text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,background-color .2s,border-color .2s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn-hi{background:var(--hi);color:var(--hi-ink)}
.btn-hi:hover{filter:brightness(.94)}
.btn-ink{background:var(--text);color:var(--bg)}
.btn-ghost{border-color:var(--line);color:var(--text);background:transparent}
.btn-ghost:hover{border-color:var(--text)}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:1rem;top:-100px;background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:8px;z-index:100}
.skip:focus{top:1rem}
/* tabla */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.75rem .9rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .78rem/1.3 var(--f-mono);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:1.25rem;height:68px}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--text);font:800 1.5rem/1 var(--f-display);letter-spacing:-.05em}
.brand svg{width:30px;height:30px}
.navlinks{display:flex;gap:1.3rem;margin-left:1rem}
.navlinks a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
.navlinks a:hover{color:var(--text)}
.nav-end{margin-left:auto;display:flex;align-items:center;gap:.6rem}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .78rem/1 var(--f-mono);padding:.45rem .55rem;border-radius:999px;cursor:pointer;min-width:36px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.iconbtn .moon{display:none}[data-mode="dark"] .iconbtn .sun{display:none}[data-mode="dark"] .iconbtn .moon{display:block}
.nav .btn{min-height:40px;padding:.5rem 1rem;font-size:.92rem}
.menu-t{display:none}
.mpanel{display:none}
footer.foot{border-top:1px solid var(--line);padding:2.5rem 0 3rem;color:var(--muted);font-size:.9rem}
footer.foot .wrap{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:center}
.src{font-size:.78rem;color:var(--muted)}
.src a{color:var(--muted)}
sup.ref a{font:500 .7rem var(--f-mono);color:var(--accent);text-decoration:none;margin-left:2px}
@media (max-width:1000px){.navlinks{display:none}.grid4{grid-template-columns:1fr 1fr}.menu-t{display:grid}.mpanel.open{display:grid;gap:.2rem;padding:.4rem 0 1rem}.mpanel a{padding:.7rem 0;text-decoration:none;border-bottom:1px solid var(--line);font-weight:500}}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.nav .btn.desk{display:none}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}body{font-size:1rem}.seg button{min-width:30px;padding:.42rem .4rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.top,.no-print{display:none!important}body{background:#fff}}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 68px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:1rem .8rem;display:flex;flex-direction:column;gap:.25rem;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.co{display:flex;gap:.6rem;align-items:center;padding:.4rem .5rem .9rem;border-bottom:1px solid var(--line);margin-bottom:.5rem}
.co b{font-size:.9rem;display:block}.co small{font:500 .7rem var(--f-mono);color:var(--muted)}
.nv{display:flex;gap:.6rem;align-items:center;padding:.6rem .65rem;border-radius:10px;color:var(--muted);cursor:pointer;border:0;background:none;font:500 .93rem var(--f-body);text-align:left;width:100%}
.nv svg{width:18px;height:18px;flex:none}
.nv[aria-current="page"]{background:var(--surface-2);color:var(--text);font-weight:600}
.nv .badge{margin-left:auto;font:600 .66rem var(--f-mono);background:var(--lime);color:var(--hi-ink);border-radius:6px;padding:.1rem .35rem}

<script>/* ===== Marca: cambia el nombre, el logo y la paleta aquí y se aplica en todos los documentos ===== */
const BRAND={name:"kontu",display:"Kontu",logo:"pulso",palette:"cobalto"};
(function(){try{const q=new URLSearchParams(location.search);const n=q.get('name')||localStorage.getItem('brand-name');if(n){BRAND.name=n.toLowerCase();BRAND.display=n.charAt(0).toUpperCase()+n.slice(1).toLowerCase()}const l=q.get('logo')||localStorage.getItem('brand-logo');if(l)BRAND.logo=l;const pl=q.get('palette')||localStorage.getItem('brand-palette');if(pl)BRAND.palette=pl}catch(e){}
 if(BRAND.palette&&BRAND.palette!=='cobalto')document.documentElement.dataset.palette=BRAND.palette;})();
const CORE_LOGOS={
  acierto:(a="var(--hi)")=>`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="22" cy="26" r="17" fill="none" stroke="currentColor" stroke-width="5.5"/><circle cx="22" cy="26" r="6.5" fill="${a}"/><path d="M26 22 L41 7" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M35 5.5 L42.5 5.5 L42.5 13" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  mirada:(a="var(--hi)")=>`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M3 24C9 12.5 16 8 24 8s15 4.5 21 16c-6 11.5-13 16-21 16S9 35.5 3 24z" fill="currentColor"/><circle cx="24" cy="24" r="10" fill="${a}"/><g fill="currentColor"><rect x="18.6" y="24" width="2.8" height="5" rx="1.2"/><rect x="22.6" y="21" width="2.8" height="8" rx="1.2"/><rect x="26.6" y="18" width="2.8" height="11" rx="1.2"/></g></svg>`,
  bloques:(a="var(--hi)")=>`<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="currentColor"><rect x="4" y="4" width="11" height="11" rx="3"/><rect x="18.5" y="4" width="11" height="11" rx="3"/><rect x="33" y="4" width="11" height="11" rx="3" opacity=".45"/><rect x="4" y="18.5" width="11" height="11" rx="3"/><rect x="4" y="33" width="11" height="11" rx="3"/><rect x="18.5" y="33" width="11" height="11" rx="3"/><rect x="33" y="33" width="11" height="11" rx="3" opacity=".45"/></g><rect x="18.5" y="18.5" width="11" height="11" rx="3" fill="${a}"/></svg>`,
  nucleo:(a="var(--hi)")=>`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="28.5" cy="19.5" r="6.5" fill="${a}"/></svg>`,
  orbita:(a="var(--hi)")=>`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M37 13.5A17 17 0 1 0 37 34.5" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="40" cy="24" r="5" fill="${a}"/></svg>`,
  pulso:(a="var(--hi)")=>`<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40" rx="12" fill="currentColor"/><path d="M11 31l8-7 6 4 11-12" fill="none" stroke="${a}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="16" r="3.6" fill="${a}"/></svg>`,
  capas:(a="var(--hi)")=>`<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M38 12A19 19 0 1 0 38 36" stroke-width="4.5"/><path d="M32.5 17.5A11.5 11.5 0 1 0 32.5 30.5" stroke-width="4.5" opacity=".55"/></g><circle cx="24" cy="24" r="4.5" fill="${a}"/></svg>`
};
const CORE={
  lang:'es',
  store:{get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}},
  L(o){if(o==null)return'';let r=typeof o==='string'?o:(o[CORE.lang]??o.es??'');return typeof r==='string'?r.replace(/CORE/g,BRAND.display):r},
  fmt(n,d=0,cur){const loc=CORE.lang==='pt'?'pt-BR':CORE.lang==='en'?'en-US':CORE.lang==='fr'?'fr-FR':'es-PE';const s=new Intl.NumberFormat(loc,{maximumFractionDigits:d,minimumFractionDigits:d}).format(n);return cur?cur+' '+s:s},
  initChrome(onLang){
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const mq=matchMedia('(prefers-color-scheme: dark)');
    const qs=new URLSearchParams(location.search);
    const setMode=(m,save)=>{document.documentElement.dataset.mode=m;const b=$('#modeBtn');if(b)b.setAttribute('aria-pressed',String(m==='dark'));if(save)CORE.store.set('core-mode',m);document.dispatchEvent(new Event('core:mode'))};
    setMode(qs.get('mode')||CORE.store.get('core-mode')||(mq.matches?'dark':'light'));
    const mb=$('#modeBtn');if(mb)mb.addEventListener('click',()=>setMode(document.documentElement.dataset.mode==='dark'?'light':'dark',true));
    mq.addEventListener&&mq.addEventListener('change',e=>{if(!CORE.store.get('core-mode'))setMode(e.matches?'dark':'light')});
    const setLang=l=>{CORE.lang=['es','en','pt','fr'].includes(l)?l:'es';document.documentElement.lang=CORE.lang==='pt'?'pt-BR':CORE.lang;
      $$('[data-l]').forEach(el=>{const o=(typeof T!=='undefined')&&T[el.dataset.l];if(o)el.innerHTML=CORE.L(o)});
      $$('[data-la]').forEach(el=>{const o=(typeof T!=='undefined')&&T[el.dataset.la];if(o)el.setAttribute('aria-label',CORE.L(o))});
      $$('[data-lph]').forEach(el=>{const o=(typeof T!=='undefined')&&T[el.dataset.lph];if(o)el.setAttribute('placeholder',CORE.L(o))});
      $$('.seg [data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===CORE.lang)));
      CORE.store.set('core-lang',CORE.lang);onLang&&onLang(CORE.lang)};
    $$('.seg [data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
    const mt=$('.menu-t'),mp=$('.mpanel');
    if(mt&&mp){mt.addEventListener('click',()=>{const o=mp.classList.toggle('open');mt.setAttribute('aria-expanded',String(o))});mp.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mp.classList.remove('open');mt.setAttribute('aria-expanded','false')}))}
    $$('[data-logo]').forEach(el=>el.innerHTML=(CORE_LOGOS[BRAND.logo]||CORE_LOGOS.pulso)());
    $$('.bname').forEach(el=>el.textContent=BRAND.name);
    document.title=document.title.replace(/CORE/g,BRAND.display);
    try{const cs=getComputedStyle(document.documentElement);const svg=(CORE_LOGOS[BRAND.logo]||CORE_LOGOS.pulso)(cs.getPropertyValue('--lime').trim()).replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"').replace(/currentColor/g,cs.getPropertyValue('--ink').trim());let f=document.querySelector('link[rel="icon"]');if(!f){f=document.createElement('link');f.rel='icon';document.head.appendChild(f)}f.href='data:image/svg+xml,'+encodeURIComponent(svg)}catch(e){}

    setLang(qs.get('lang')||CORE.store.get('core-lang')||(['en','pt','fr'].includes(nl)?nl:'es'));
    return setLang;

<script>/* ===== CONFIGURACIÓN DE LA APP: completa con tus datos ===== */
const KCFG={
  supabaseUrl:"",            // Supabase > Project Settings > API > Project URL
  supabaseAnonKey:"",        // Supabase > Project Settings > API > anon public key
  landingUrl:"index.html", // en Vercel: "index.html"
  portalUrl:"",              // Polar > Settings > Customer portal (link para que el cliente gestione tarjeta y facturas)
  payLinks:{diag:"",pulso:"",brujula:"",torre:"",esencial:"",empresa:"",multipais:"",constitucion:"",llc:"",legal:""}
};
/* ===== Kontu · conexión a Supabase (base de datos y cuentas) y Polar (pagos). Si faltan las claves, funciona en modo demo ===== */
const KB={
  ok:()=>!!(KCFG.supabaseUrl&&KCFG.supabaseAnonKey),
  _c:null,
  async c(){if(!KB.ok())return null;if(KB._c)return KB._c;
    if(!window.supabase){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
    KB._c=window.supabase.createClient(KCFG.supabaseUrl,KCFG.supabaseAnonKey);return KB._c},
  demo(table,row){try{const k='kontu-demo-'+table,a=JSON.parse(localStorage.getItem(k)||'[]');a.push(row);localStorage.setItem(k,JSON.stringify(a))}catch(e){}return {demo:true}},
  async save(table,row){const c=await KB.c();if(!c)return KB.demo(table,row);const {error}=await c.from(table).insert(row);if(error)throw error;return {ok:true}},
  async upsert(table,row){const c=await KB.c();if(!c)return KB.demo(table,row);const {error}=await c.from(table).upsert(row);if(error)throw error;return {ok:true}},
  async get(table,match){const c=await KB.c();if(!c)return null;const {data,error}=await c.from(table).select('*').match(match).maybeSingle();if(error)throw error;return data},
  async list(table){const c=await KB.c();if(!c)return [];const {data,error}=await c.from(table).select('*').order('created_at',{ascending:false});if(error)throw error;return data||[]},

function lineChart(sets,labels,h=200){const W=640,l=46,r=10,t=10,b=24;const all=sets.flatMap(s=>s.v),mx=Math.max(...all)*1.1,mn=Math.min(0,...all);const x=i=>l+i*(W-l-r)/(labels.length-1),y=v=>t+(1-(v-mn)/(mx-mn))*(h-t-b);let s=`<svg viewBox="0 0 ${W} ${h}">`;for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${CORE.fmt(v/1000,0)}k</text>`}labels.forEach((lb,i)=>s+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${lb}</text>`);sets.forEach(se=>{const p=se.v.map((v,i)=>`${x(i)},${y(v)}`).join(' ');if(se.a)s+=`<polygon points="${x(0)},${y(mn)} ${p} ${x(se.v.length-1)},${y(mn)}" fill="${se.c}" fill-opacity=".12"/>`;s+=`<polyline points="${p}" fill="none" stroke="${se.c}" stroke-width="2.5" ${se.d?'stroke-dasharray="6 5"':''}/>`});return s+'</svg>'}

<div style="display:grid;gap:1rem;align-content:start"><div class="card"><h3 style="margin-bottom:.8rem">${L(X('Método de pago','Payment method','Forma de pagamento',"Moyen de paiement"))}</h3><div style="display:flex;gap:.8rem;align-items:center;padding:.8rem;border:1px solid var(--line);border-radius:12px"><span style="font:700 .8rem var(--f-mono);background:var(--ink);color:#fff;padding:.4rem .55rem;border-radius:6px">${c.brand}</span><span><b>${L(c.tipo)} •••• ${c.last}</b><br><small class="muted">${c.holder} · ${L(X('vence','exp.','vence',"exp."))} ${c.exp}</small></span></div><label style="display:flex;gap:.6rem;align-items:center;margin-top:.8rem;font-size:.92rem"><input type="checkbox" id="auto" ${BILL.auto?'checked':''} style="width:20px;height:20px;accent-color:var(--violet)">${L(X('Cobrar automáticamente cada mes','Charge automatically every month','Cobrar automaticamente todo mês',"Prélever automatiquement chaque mois"))}</label><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem"><button class="btn btn-ghost" id="chgCard" style="min-height:38px;font-size:.86rem">${L(X('Cambiar o agregar tarjeta','Change or add card','Trocar ou adicionar cartão',"Changer ou ajouter une carte"))}</button></div><p class="muted" style="font-size:.8rem;margin-top:.6rem">${L(X('La tarjeta se registra en una pasarela de pagos certificada. Nunca guardamos el número completo.','Cards are stored by a certified payment processor. We never store the full number.','O cartão é registrado num processador de pagamentos certificado. Nunca guardamos o número completo.',"Les cartes sont conservées par un prestataire de paiement certifié. Nous ne stockons jamais le numéro complet."))}</p></div>
<div class="card"><h3 style="margin-bottom:.6rem">${L(X('Datos del comprobante','Receipt details','Dados do comprovante',"Données du justificatif"))}</h3><div class="answered"><div><span>${L(X('Tipo','Type','Tipo',"Type"))}</span><b>${CO.fact==='boleta'?'Boleta':'Factura'}</b></div><div><span>${IDN[CO.pais]}</span><b class="mono">${CO.id}</b></div><div><span>${L(X('Razón social','Company','Razão social',"Entreprise"))}</span><b>${CO.razon}</b></div><div><span>${L(X('Se envía a','Sent to','Enviado para',"Envoyé à"))}</span><b>${CO.email}</b></div></div><a href="#" data-v="emp" class="nvl" style="display:inline-block;margin-top:.7rem;color:var(--accent);font-size:.88rem">${L(X('Corregir en Mi empresa →','Fix in My company →','Corrigir em Minha empresa →',"Corriger dans Mon entreprise →"))}</a></div>
<div class="card"><h3 style="margin-bottom:.6rem">${L(X('Plan','Plan','Plano',"Plan"))}</h3><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn btn-ghost" id="chgPlan" style="min-height:38px;font-size:.86rem">${L(X('Cambiar plan','Change plan','Trocar plano',"Changer de plan"))}</button><button class="btn btn-ghost" id="cancel" style="min-height:38px;font-size:.86rem">${L(X('Cancelar','Cancel','Cancelar',"Annuler"))}</button></div></div></div></div>`}

let ONB=S.get('onb',0);
function vOnb(){const st=ONB;const steps=[X('Confirma tus datos','Confirm your details','Confirme seus dados',"Confirmez vos informations"),X('Conecta tu información','Connect your data','Conecte suas informações',"Connectez vos données"),X('Invita a tu equipo','Invite your team','Convide sua equipe',"Invitez votre équipe"),X('Cuéntanos de tu negocio','Tell us about your business','Conte sobre seu negócio',"Parlez-nous de votre entreprise")];
 const body=[()=>`<p class="muted">${L(X('Tomamos estos datos de tu reserva del piloto. Si algo está mal (por ejemplo, el RUC), corrígelo aquí.','We took these from your pilot booking. If anything is wrong (e.g. tax ID), fix it here.','Pegamos estes dados da sua reserva. Se algo estiver errado (ex.: CNPJ/RUC), corrija aqui.',"Nous les avons reprises de votre réservation pilote. Si quelque chose est faux (p. ex. l’identifiant fiscal), corrigez-le ici."))}</p>${coForm('onb')}`,
 ()=>`<p class="muted">${L(X('Elige cómo nos llega tu información. Puedes usar varias.','Choose how your data reaches us. You can use several.','Escolha como as informações chegam. Pode usar várias.',"Choisissez comment vos données nous parviennent. Vous pouvez en utiliser plusieurs."))}</p><div class="conns" style="margin-top:.8rem">${[[X('SUNAT (solo lectura)','SUNAT (read-only)','SUNAT (só leitura)',"SUNAT (lecture seule)"),X('Usuario secundario de consulta','Read-only secondary user','Usuário secundário de consulta',"Utilisateur secondaire en lecture seule")],[X('Subir archivos','Upload files','Enviar arquivos',"Téléverser des fichiers"),X('Fotos, PDF, XML, Excel','Photos, PDF, XML, Excel','Fotos, PDF, XML, Excel',"Photos, PDF, XML, Excel")],['WhatsApp',X('Reenvía tus comprobantes','Forward your receipts','Encaminhe comprovantes',"Transférez vos justificatifs")]].map(([a,b])=>`<label class="card cn" style="cursor:pointer"><b>${L(a)}</b><p>${L(b)}</p><input type="checkbox" checked style="accent-color:var(--violet);width:18px;height:18px"></label>`).join('')}</div>`,
 ()=>`<p class="muted">${L(X('Opcional. Tu contadora asignada ya está incluida.','Optional. Your assigned accountant is already included.','Opcional. Sua contadora já está incluída.',"Facultatif. Votre comptable attitré est déjà inclus."))}</p><input type="email" placeholder="${L(X('correo@empresa.com','email@company.com','email@empresa.com',"email@entreprise.com"))}" style="font:inherit;padding:.7rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);width:100%;margin-top:.8rem">`,
 ()=>`<p class="muted">${L(X('3 preguntas para que las respuestas tengan sentido desde el primer día. Puedes completar el resto en Contexto.','3 questions so answers make sense from day one. Finish the rest in Context.','3 perguntas para que as respostas façam sentido desde o primeiro dia. Complete o resto em Contexto.',"3 questions pour que les réponses aient du sens dès le premier jour. Terminez le reste dans Contexte."))}</p>${CTXQ.slice(0,3).map(q=>`<div style="margin-top:.8rem"><b>${L(q[1])}</b><div class="qopts" style="margin-top:.4rem">${q[2].map((o,i)=>`<button data-k="${q[0]}" data-v="${i}" aria-pressed="${CTX[q[0]]===i}">${L(o)}</button>`).join('')}</div></div>`).join('')}`];
 return `<div class="vh"><div><h1>${L(X('¡Bienvenida! Dejemos todo listo','Welcome! Let’s get you set up','Bem-vinda! Vamos deixar tudo pronto',"Bienvenue ! Configurons votre espace"))}</h1><p>${L(X('4 pasos, unos 5 minutos. Tu primer reporte llega en 48 horas.','4 steps, about 5 minutes. Your first report arrives in 48 hours.','4 passos, cerca de 5 minutos. Seu primeiro relatório chega em 48 horas.',"4 étapes, environ 5 minutes. Votre premier rapport arrive en 48 heures."))}</p></div><span class="demo-tag">${st+1}/4</span></div>
 <div class="pipe">${steps.map((t,i)=>`<span class="ps ${i<st?'done':i===st?'run':''}">${i+1}. ${L(t)}</span>`).join('')}</div>
 <div class="card" style="display:grid;gap:.6rem"><h3>${L(steps[st])}</h3>${body[st]()}</div>
 <div style="display:flex;gap:.6rem;flex-wrap:wrap">${st>0?`<button class="btn btn-ghost" id="onbB">${L(X('Atrás','Back','Voltar',"Retour"))}</button>`:''}<button class="btn btn-hi" id="onbN">${L(st<3?X('Continuar','Continue','Continuar',"Continuer"):X('Ir a mi panel','Go to my dashboard','Ir ao meu painel',"Aller à mon tableau de bord"))}</button><button class="btn btn-ghost" id="onbS" style="margin-left:auto">${L(X('Completar después','Finish later','Completar depois',"Terminer plus tard"))}</button></div>`}

let KUSER=null;
async function kLoad(){try{KUSER=await KB.user();if(!KUSER)return;const e=await KB.get('empresas',{user_id:KUSER.id});if(e){CO={...CO,...e.data};S.set('co',CO)}const cx=await KB.get('contexto',{user_id:KUSER.id});if(cx){CTX=cx.data;S.set('ctx',CTX)}const ds=await KB.list('documentos');if(ds.length){DOCS=ds.map(r=>r.data);S.set('docs',DOCS)}}catch(err){console.warn('kLoad',err)}}
const kSaveCo=()=>{if(KUSER)KB.upsert('empresas',{user_id:KUSER.id,data:CO,updated_at:new Date().toISOString()}).catch(e=>console.warn(e))};
const kSaveCtx=()=>{if(KUSER)KB.upsert('contexto',{user_id:KUSER.id,data:CTX,updated_at:new Date().toISOString()}).catch(e=>console.warn(e))};
async function kLogout(){await KB.out();KUSER=null;S.set('in',false);S.set('onbDone',false);const a=document.getElementById('kauthA');if(a)delete a.dataset.b;document.getElementById('app').classList.add('hide');document.getElementById('login').classList.remove('hide');render()}
const VIEWS={onb:vOnb,emp:vEmp,fac:vFac,home:vHome,docs:vDocs,ask:vAsk,ctx:vCtx,scn:vScn,cmp:vCmp,int:vInt};
function renderSide(){$('#side').innerHTML=`<div class="co"><span style="width:30px;height:30px;display:block;color:var(--text)">${CORE_LOGOS[BRAND.logo]()}</span><div><b>${CO.razon}</b><small>${IDN[CO.pais]} ${CO.id} · ${CO.pais}</small></div></div>`+NAV.map(([k,i,n])=>`<button class="nv" data-v="${k}" ${k===view?'aria-current="page"':''}>${ic(i)}${L(n)}${k==='ctx'&&ctxPct()<100?`<span class="badge">${ctxPct()}%</span>`:''}</button>`).join('')+`<div class="ctxm">${L(X('El agente conoce','The agent knows','O agente conhece',"L’agent connaît"))} <b>${ctxPct()}%</b> ${L(X('de tu negocio','of your business','do seu negócio',"de votre entreprise"))}<div class="b"><i style="width:${ctxPct()}%"></i></div><a href="#" data-v="ctx" class="nvl" style="color:var(--accent);font-size:.82rem">${L(X('Completar contexto →','Complete context →','Completar contexto →',"Compléter le contexte →"))}</a></div><button class="nv" id="kout" style="margin-top:.4rem">↩ ${L(X('Cerrar sesión','Log out','Sair',"Se déconnecter"))}</button><a class="nv" href="${KCFG.landingUrl}#regulacion" style="font-size:.82rem">⚖ ${L(X('Regulación de IA y datos','AI & data regulation','Regulação de IA e dados',"Réglementation IA et données"))}</a>`;const ko=document.getElementById('kout');if(ko)ko.onclick=kLogout;$$('#side [data-v]').forEach(b=>b.onclick=e=>{e.preventDefault();if(!S.get('onbDone',false))S.set('onbDone',true);go(b.dataset.v)})}
function go(v){view=v;S.set('view',v);render()}
function render(){if(!S.get('in',false)){const a=document.getElementById('kauthA');if(a&&!a.dataset.b){a.dataset.b=1;a.innerHTML=authFormHTML('kaA');bindAuth(a,{redirect:location.origin+location.pathname,onIn:()=>{S.set('in',true);kLoad().then(render)}})}return}if(!S.get('onbDone',false)&&view!=='onb'){view='onb'}$('#login').classList.add('hide');$('#app').classList.remove('hide');renderSide();$('#main').innerHTML=VIEWS[view]();bind()}
function bind(){
  $$('#main .nvl').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.v)});
  $$('[data-q]').forEach(b=>b.onclick=()=>{if(view!=='ask'){view='ask';S.set('view','ask');render()}ask(b.dataset.q)});
  if(view==='docs'){renderDocsTable();const d=$('#drop'),f=$('#file');f.onchange=()=>ingest([...f.files]);['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',x=>ingest([...x.dataTransfer.files]))}
  if(view==='ask'){renderMsgs();if(!CHAT.length){CHAT.push({t:L(X('Hola, soy tu agente financiero. Pregúntame lo que quieras sobre tu negocio; cada respuesta indica de qué documentos salió.','Hi, I’m your finance agent. Ask me anything about your business; every answer shows which documents it used.','Olá, sou seu agente financeiro. Pergunte o que quiser sobre seu negócio; cada resposta mostra de quais documentos saiu.',"Bonjour, je suis votre agent financier. Posez-moi n’importe quelle question sur votre entreprise ; chaque réponse indique les documents utilisés."))});renderMsgs()}$('#cin').onsubmit=e=>{e.preventDefault();const i=$('#cinI');ask(i.value);i.value=''}}
  if(view==='ctx'){$$('.qopts button').forEach(b=>b.onclick=()=>{CTX[b.dataset.k]=+b.dataset.v;S.set('ctx',CTX);kSaveCtx();render()});const r=$('#ctxReset');if(r)r.onclick=()=>{CTX={};S.set('ctx',CTX);render()}}
  if(view==='scn'){drawScn();$$('.sl input').forEach(i=>i.oninput=()=>{SC[i.dataset.k]=+i.value;S.set('sc',SC);const o=i.previousElementSibling.querySelector('output');o.textContent=i.dataset.k==='d'?fmtS(SC.d):SC[i.dataset.k]+'%';drawScn()})}
  if(view==='emp'){bindCoForm('emp',()=>setTimeout(render,1600));$('#inv').onsubmit=e=>{e.preventDefault();const em=$('#invE').value.trim();if(!em)return;USERS.push([em,em,X($('#invR').value,$('#invR').value,$('#invR').value,$('#invR').value)]);S.set('users',USERS);render()}}
  if(view==='fac'){$('#auto').onchange=e=>{BILL.auto=e.target.checked;S.set('bill',BILL);render()};$('#chgCard').onclick=()=>KCFG.portalUrl?window.open(KCFG.portalUrl,'_blank','noopener'):dlg(`<h2 style="font-size:1.3rem">${L(X('Cambiar o agregar tarjeta','Change or add card','Trocar ou adicionar cartão',"Changer ou ajouter une carte"))}</h2><p class="muted">${L(X("Se abre la ventana segura de la pasarela de pagos: débito o crédito, de la empresa o personal, con varias tarjetas y una predeterminada.","The payment processor’s secure window opens: debit or credit, company or personal, with several cards and one as default.","Abre a janela segura do processador de pagamentos: débito ou crédito, da empresa ou pessoal, com vários cartões e um padrão.","La fenêtre sécurisée du prestataire de paiement s’ouvre : débit ou crédit, de l’entreprise ou personnelle, avec plusieurs cartes dont une par défaut."))}</p>`);$$('.paynow').forEach(b=>b.onclick=()=>KCFG.portalUrl?window.open(KCFG.portalUrl,'_blank','noopener'):dlg(`<h2 style="font-size:1.3rem">${L(X('Pagar ahora','Pay now','Pagar agora',"Payer maintenant"))}</h2><p class="muted">${L(X('Se abre el enlace de pago de esta factura (tarjeta o billetera digital). Al confirmarse, el comprobante aparece aquí y llega a tu correo.','The payment link for this invoice opens (card or digital wallet). Once confirmed, the receipt appears here and in your email.','Abre o link de pagamento desta fatura (cartão ou carteira digital). Confirmado, o comprovante aparece aqui e no e-mail.',"Le lien de paiement de cette facture s’ouvre (carte ou portefeuille numérique). Une fois confirmé, le justificatif apparaît ici et dans votre e-mail."))}</p>`));$$('.dl').forEach(b=>b.onclick=()=>dlg(`<p class="muted">${L(X("Descargas el PDF y el XML del comprobante electrónico.","You download the e-receipt PDF and XML.","Você baixa o PDF e o XML do comprovante eletrônico.","Vous téléchargez le PDF et le XML du justificatif électronique."))}</p>`));$('#chgPlan').onclick=()=>dlg(`<h2 style="font-size:1.3rem">${L(X('Cambiar plan','Change plan','Trocar plano',"Changer de plan"))}</h2><p class="muted">${L(X('Subir de plan aplica al instante con cobro proporcional; bajar aplica desde el siguiente mes. Durante el piloto se mantiene el 30 % de descuento.','Upgrades apply instantly with prorated charge; downgrades apply next month. The 30% pilot discount stays during the pilot.','Subir de plano vale na hora com cobrança proporcional; descer vale no mês seguinte. O desconto de 30% se mantém no piloto.',"Les montées de gamme s’appliquent immédiatement avec un montant au prorata ; les descentes, le mois suivant. La remise pilote de 30 % reste valable pendant le pilote."))}</p>`);$('#cancel').onclick=()=>dlg(`<h2 style="font-size:1.3rem">${L(X('Antes de cancelar','Before you cancel','Antes de cancelar',"Avant de résilier"))}</h2><p class="muted">${L(X('Puedes pausar un mes o hablar con tu contadora. Si cancelas, tienes 30 días para descargar tus datos.','You can pause a month or talk to your accountant. If you cancel, you have 30 days to download your data.','Você pode pausar um mês ou falar com a contadora. Se cancelar, tem 30 dias para baixar seus dados.',"Vous pouvez mettre un mois en pause ou parler à votre comptable. Si vous résiliez, vous avez 30 jours pour télécharger vos données."))}</p>`)}
  if(view==='onb'){bindCoForm('onb');$$('.qopts button').forEach(b=>b.onclick=()=>{CTX[b.dataset.k]=+b.dataset.v;S.set('ctx',CTX);kSaveCtx();render()});const nx=$('#onbN'),bk=$('#onbB'),sk=$('#onbS');nx.onclick=()=>{if(ONB===0){$('#onbSave').click();if($('#onbMsg').style.color==='var(--coral)')return}if(ONB<3){ONB++;S.set('onb',ONB);render()}else{S.set('onbDone',true);go('home')}};if(bk)bk.onclick=()=>{ONB--;S.set('onb',ONB);render()};sk.onclick=()=>{S.set('onbDone',true);go('home')}}
  if(view==='int'){$$('.cbtn').forEach(b=>b.onclick=()=>{const c=CONNS[+b.dataset.i];$('#dlgB').innerHTML=`<h2 style="font-size:1.3rem">${L(c[0])}</h2><p class="muted">${L(c[1])}</p><ol>${L(c[3]).map(s=>`<li>${s}</li>`).join('')}</ol><p class="muted" style="font-size:.82rem">${L(X("Tus credenciales nunca se muestran en texto plano.","Your credentials are never shown in plain text.","Suas credenciais nunca são exibidas em texto simples.","Vos identifiants ne sont jamais affichés en clair."))}</p><button class="btn btn-ink" id="dlgX" style="justify-self:start">${L(X('Entendido','Got it','Entendi',"Compris"))}</button>`;const d=$('#dlg');d.showModal?d.showModal():d.setAttribute('open','');$('#dlgX').onclick=()=>d.close()})}
}
$('#dwX').onclick=()=>{$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')};


(async()=>{if(KB.ok()){const u=await KB.user().catch(()=>null);if(u){S.set('in',true);await kLoad()}else S.set('in',false)}
 if(new URLSearchParams(location.search).get('pago')==='ok'){setTimeout(()=>dlg(`<h2 style="font-size:1.3rem">${L(X('¡Pago recibido!','Payment received!','Pagamento recebido!',"Paiement reçu !"))}</h2><p class="muted">${L(X('Gracias. Tu plan se activa en minutos; si aún no tienes cuenta, créala con el mismo correo del pago.','Thank you. Your plan activates in minutes; if you don’t have an account yet, sign up with the same email you paid with.','Obrigado. Seu plano ativa em minutos; se ainda não tem conta, crie com o mesmo e-mail do pagamento.',"Merci. Votre plan s’active en quelques minutes ; si vous n’avez pas encore de compte, inscrivez-vous avec le même e-mail que celui du paiement."))}</p>`),600)}
 CORE.initChrome(()=>{CHAT=[];const ka=document.getElementById('kauthA');if(ka&&!S.get('in',false))delete ka.dataset.b;render()})})();
